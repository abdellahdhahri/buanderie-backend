spring.config.import=optional:file:.env
spring.application.name=Buanderie
server.port=${SERVER_PORT:8082}


groq.api-key=${GROQ_API_KEY}
groq.base-url=https://api.groq.com/openai/v1
groq.model=openai/gpt-oss-20b


openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=openrouter/free


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration=${SECURITY_JWT_EXPIRATION:3600000}

cubix.base-url=${CUBIX_BASE_URL}

# =========================
# POSTGRESQL
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.fail-on-empty-beans=false

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# =========================
# SQL SERVER
# =========================
sqlserver.datasource.url=${SQLSERVER_URL}
sqlserver.datasource.username=${SQLSERVER_USERNAME}
sqlserver.datasource.password=${SQLSERVER_PASSWORD}
sqlserver.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================
# LOGGING (surchargé par profil)
# =========================
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_HIBERNATE_BIND:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BINDER:WARN}